<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>@marianmeres/icons-fns — example</title>
		<meta
			name="description"
			content="Ten icons from each of the 19 families — tweak the props live and copy the import."
		/>
		<!-- Tracks the active (manually toggled) theme; updated by main.ts. -->
		<meta name="theme-color" content="#fafafa" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>✨</text></svg>"
		/>

		<!--
			Styling follows @marianmeres/design-tokens with the Reboot bridge:
			  · reboot.css — Bootstrap Reboot element normalize/reset (consumes --bs-*)
			  · theme.css  — design-tokens "zinc" theme + reboot bridge
			                 (sets --stuic-color-* AND the --bs-* vars; dark on :root.dark)
			  · the inline block below — minimal, token-driven example layout
		-->
		<link rel="stylesheet" href="./reboot.css" />
		<link rel="stylesheet" href="./theme.css" />

		<!--
			Anti-FOUC: set the dark class before first paint so dark-preference
			users don't flash light. main.ts re-confirms this idempotently.
			The storage key must match THEME_KEY in main.ts.
		-->
		<script>
		try {
			var k = "icons-fns-example-theme";
			var s = localStorage.getItem(k);
			var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.classList.toggle("dark", d);
		} catch (e) {}
		</script>

		<style>
		:root {
			color-scheme: light;
		}
		:root.dark {
			color-scheme: dark;
		}

		.app {
			max-width: 56rem;
			margin: 0 auto;
			padding: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem) 3rem;
		}

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1.25rem;
		}
		.app-header h1 {
			margin: 0 0 0.3rem;
			font-size: 1.05rem;
			font-weight: 600;
			line-height: 1.3;
		}
		.app-header h1 a {
			color: inherit;
			text-decoration: none;
		}
		.app-header h1 code {
			color: inherit;
			font-size: 0.95em;
		}
		.lead {
			max-width: 62ch;
			margin: 0;
			color: var(--stuic-color-muted-foreground);
			font-size: 0.9rem;
		}
		.lead strong {
			color: var(--stuic-color-foreground);
			font-weight: 600;
		}

		.theme-toggle {
			flex: none;
			width: 2.75rem;
			height: 2.75rem;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.5rem;
			background: var(--stuic-color-surface);
			color: var(--stuic-color-surface-foreground);
			font-size: 1.1rem;
			line-height: 1;
			cursor: pointer;
		}
		.theme-toggle:hover {
			background: var(--stuic-color-surface-hover);
		}

		/* The prop controls follow you down the page — the whole point is
		   watching every family react to the same change. */
		.controls {
			position: sticky;
			top: 0;
			z-index: 1;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.5rem 1.25rem;
			padding: 0.6rem 0;
			border-bottom: 1px solid var(--stuic-color-border);
			background: var(--stuic-color-background);
		}
		.control {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			min-height: 2.5rem;
			font-size: 0.85rem;
			color: var(--stuic-color-muted-foreground);
			white-space: nowrap;
		}
		.control input[type="range"] {
			width: 7rem;
			accent-color: var(--stuic-color-primary);
			cursor: pointer;
		}
		.control output {
			min-width: 3.2ch;
			font-variant-numeric: tabular-nums;
			color: var(--stuic-color-foreground);
		}

		/* Color chips — each sets the page's CSS `color`, which the icons
		   inherit through `currentColor`. */
		.tones {
			display: inline-flex;
			gap: 0.3rem;
		}
		.tone input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}
		.tone span {
			display: block;
			width: 1.5rem;
			height: 1.5rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 50%;
			background: currentColor;
			cursor: pointer;
		}
		.tone:has(input:checked) span {
			outline: 2px solid var(--stuic-color-ring);
			outline-offset: 2px;
		}
		.tone:has(input:focus-visible) span {
			outline: 2px solid var(--stuic-color-primary);
			outline-offset: 2px;
		}

		/* One section per family. */
		.family {
			padding-top: 1.5rem;
		}
		.family + .family {
			border-top: 1px solid var(--stuic-color-border);
		}
		.family h2 {
			margin: 0 0 0.15rem;
			font-size: 0.95rem;
			font-weight: 600;
		}
		.family-meta {
			margin: 0 0 0.75rem;
			font-size: 0.78rem;
			color: var(--stuic-color-muted-foreground);
		}
		.family-meta code {
			font-size: 0.95em;
		}

		/* `color` comes from the tone chips and is inherited by every icon;
		   the columns are sized off the current `size` prop, so ten icons sit
		   on one row at the default — the same concept then lines up in the
		   same column all the way down the page. Narrow viewports (or a big
		   `size`) wrap, as they should. */
		.icons {
			display: grid;
			grid-template-columns: repeat(
				auto-fit,
				minmax(min(100%, max(4.5rem, calc(var(--cell) + 0.75rem))), 1fr)
			);
			gap: 0.4rem;
			list-style: none;
			margin: 0;
			padding: 0;
		}
		.cell {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5rem;
			width: 100%;
			padding: 0.75rem 0.4rem 0.6rem;
			border: 1px solid transparent;
			border-radius: 0.5rem;
			background: none;
			color: inherit;
			font: inherit;
			text-align: center;
			cursor: pointer;
			overflow: hidden;
		}
		.cell:hover {
			border-color: var(--stuic-color-border);
			background: var(--stuic-color-surface-hover);
		}
		.cell:focus-visible {
			outline: 2px solid var(--stuic-color-primary);
			outline-offset: -2px;
		}
		/* Fixed box, so a row does not jump around as the size slider moves. */
		.cell-icon {
			display: flex;
			align-items: center;
			justify-content: center;
			width: var(--cell);
			height: var(--cell);
		}
		.cell-icon svg {
			display: block;
		}
		.cell-name {
			max-width: 100%;
			font-size: 0.7rem;
			line-height: 1.35;
			color: var(--stuic-color-muted-foreground);
			overflow-wrap: anywhere;
		}

		/* Detail dialog */
		dialog {
			width: min(42rem, calc(100vw - 2rem));
			padding: 0;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.75rem;
			background: var(--stuic-color-surface);
			color: var(--stuic-color-surface-foreground);
		}
		dialog::backdrop {
			background: rgb(0 0 0 / 0.5);
		}
		.detail {
			display: flex;
			flex-direction: column;
			gap: 1rem;
			padding: 1.25rem;
		}
		.detail-head {
			display: flex;
			align-items: flex-start;
			gap: 1rem;
		}
		.detail-preview {
			flex: none;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 6rem;
			height: 6rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.5rem;
			background: var(--stuic-color-background);
		}
		.detail-id {
			flex: 1 1 auto;
			min-width: 0;
		}
		.detail-id h2 {
			margin: 0 0 0.25rem;
			font-size: 1rem;
			font-weight: 600;
			overflow-wrap: anywhere;
		}
		.detail-id p {
			margin: 0;
			font-size: 0.8rem;
			color: var(--stuic-color-muted-foreground);
		}
		.detail-close {
			flex: none;
			width: 2rem;
			height: 2rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.4rem;
			background: var(--stuic-color-surface);
			color: inherit;
			line-height: 1;
			cursor: pointer;
		}
		.snippet {
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
		}
		.snippet-head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 1rem;
			font-size: 0.75rem;
			color: var(--stuic-color-muted-foreground);
		}
		.snippet pre {
			margin: 0;
			padding: 0.6rem 0.7rem;
			max-height: 11rem;
			overflow: auto;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.4rem;
			background: var(--stuic-color-background);
			font-size: 0.75rem;
			line-height: 1.5;
			tab-size: 2;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}
		.copy {
			flex: none;
			padding: 0.2rem 0.55rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.35rem;
			background: var(--stuic-color-surface);
			color: inherit;
			font: inherit;
			font-size: 0.7rem;
			cursor: pointer;
		}
		.copy:hover {
			background: var(--stuic-color-surface-hover);
		}
		.note {
			margin: 0;
			padding: 0.55rem 0.7rem;
			border: 1px solid var(--stuic-color-surface-accent-border);
			border-radius: 0.4rem;
			background: var(--stuic-color-surface-accent);
			color: var(--stuic-color-surface-accent-foreground);
			font-size: 0.75rem;
			line-height: 1.5;
		}

		.info {
			margin: 2.5rem 0 0;
			padding-top: 0.85rem;
			border-top: 1px solid var(--stuic-color-border);
			color: var(--stuic-color-muted-foreground);
			font-size: 0.8rem;
			line-height: 1.6;
		}
		.info a {
			color: inherit;
			text-decoration: underline;
		}

		:where(.theme-toggle, input, button):focus-visible {
			outline: 2px solid var(--stuic-color-primary);
			outline-offset: 2px;
		}
		</style>
	</head>
	<body>
		<!-- The whole UI lives in templates; main.ts clones and wires them. -->
		<template id="tpl-app">
			<div class="app">
				<header class="app-header">
					<div>
						<h1>
							<a href="https://github.com/marianmeres/icons-fns">
								<code>@marianmeres/icons-fns</code>
							</a>
						</h1>
						<p class="lead">
							<strong data-ref="total"></strong> icons from 8 providers, each
							one an individually importable function that returns an SVG
							string. Ten from every family below — move the sliders, then
							click one for its import line.
						</p>
					</div>
					<button
						type="button"
						class="theme-toggle"
						data-on="click:toggleTheme"
						aria-label="Toggle dark mode"
						title="Toggle dark mode"
					>◐</button>
				</header>

				<div class="controls">
					<label class="control">
						Size
						<input
							type="range"
							data-on="input:setSize"
							min="12"
							max="96"
							step="4"
							value="32"
						/>
						<output data-ref="sizeOut">32</output>
					</label>

					<label
						class="control"
						title="Honored by Bytesize, Feather and Lucide; the fill-based families ignore it"
					>
						Stroke
						<input
							type="range"
							data-on="input:setStroke"
							min="0.5"
							max="3"
							step="0.25"
							value="2"
						/>
						<output data-ref="strokeOut">2</output>
					</label>

					<span class="control">
						Color
						<span
							class="tones"
							data-ref="tones"
							role="radiogroup"
							aria-label="Icon color"
						></span>
					</span>
				</div>

				<div data-ref="families"></div>

				<footer class="info">
					Every icon here is rendered by the package's own <code>icon()</code>
					function — what you copy is what you get. See
					<a href="https://jsr.io/@marianmeres/icons-fns">JSR</a> ·
					<a href="https://www.npmjs.com/package/@marianmeres/icons-fns">npm</a>
					<span data-ref="version"></span>
				</footer>
			</div>
		</template>

		<!-- One family section. -->
		<template id="tpl-family">
			<section class="family">
				<h2 data-ref="label"></h2>
				<p class="family-meta" data-ref="meta"></p>
				<ul class="icons" data-ref="icons"></ul>
			</section>
		</template>

		<!-- One icon cell. The <button> is what makes it keyboard reachable. -->
		<template id="tpl-cell">
			<li>
				<button type="button" class="cell" data-on="click:openDetail">
					<span class="cell-icon" data-ref="icon"></span>
					<span class="cell-name" data-ref="name"></span>
				</button>
			</li>
		</template>

		<!-- Icon detail: preview, import line, call, and produced markup. -->
		<template id="tpl-detail">
			<div class="detail">
				<div class="detail-head">
					<span class="detail-preview" data-ref="preview"></span>
					<span class="detail-id">
						<h2 data-ref="name"></h2>
						<p data-ref="meta"></p>
					</span>
					<button
						type="button"
						class="detail-close"
						data-on="click:closeDetail"
						aria-label="Close"
					>✕</button>
				</div>

				<p class="note" data-ref="note" hidden></p>

				<div class="snippet">
					<span class="snippet-head">
						Import
						<button type="button" class="copy" data-on="click:copyImport">
							Copy
						</button>
					</span>
					<pre data-ref="import"></pre>
				</div>

				<div class="snippet">
					<span class="snippet-head">
						Call — with the props set above
						<button type="button" class="copy" data-on="click:copyCall">
							Copy
						</button>
					</span>
					<pre data-ref="call"></pre>
				</div>

				<div class="snippet">
					<span class="snippet-head">
						Returns
						<button type="button" class="copy" data-on="click:copyMarkup">
							Copy
						</button>
					</span>
					<pre data-ref="markup"></pre>
				</div>
			</div>
		</template>

		<!-- One color chip. `color` is inline so the swatch shows the tone. -->
		<template id="tpl-tone">
			<label class="tone">
				<input type="radio" name="tone" data-on="change:setTone" />
				<span data-ref="swatch"></span>
			</label>
		</template>

		<div id="app"></div>
		<dialog id="detail-dialog"></dialog>

		<script type="module" src="./dist/bundle.js"></script>
	</body>
</html>
